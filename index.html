<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>FamLingo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--acc:#2F6BFF;--acc-d:#1847C2;--acc2:#00A88F;--acc2-d:#007F6C;--tint:#E8EFFF;--ink:#1E1B4B;--line:#E4E6F3;--muted:#6B6F8E;--ok:#16A34A;--ok-d:#15803D;--bad:#E5484D;--bad-d:#BE123C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,-apple-system,Roboto,sans-serif;font-weight:700;color:var(--ink);background:#F4F5FF;min-height:100vh;-webkit-user-select:none;user-select:none}
body[data-kid="chingiz"]{background:repeating-linear-gradient(180deg,#DFF2E3 0 56px,#EEF8F0 56px 112px) fixed}
body[data-kid="tamina"]{background:linear-gradient(170deg,#FFE6F0 0%,#FFF7FA 40%,#FFF1D6 100%) fixed}
body[data-kid="sagi"]{background:linear-gradient(170deg,#EFE8FF 0%,#FAF8FF 45%,#FFF3E3 100%) fixed}
button,input{font-family:inherit}
#app{max-width:480px;margin:0 auto}
.phone{padding:var(--sat) 16px 130px;min-height:100vh;overflow-x:clip}
h1,h2,.uf{font-family:Unbounded,Nunito,system-ui,sans-serif;font-weight:800;letter-spacing:-.4px}
.muted{color:var(--muted);font-weight:700}
.small{font-size:14px;color:var(--muted)}
.card{background:#fff;border-radius:24px;padding:16px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);margin-bottom:14px}
/* tactile buttons */
.btn{display:block;width:100%;font-weight:900;font-size:18px;border-radius:18px;padding:16px;border:0;color:#fff;background:var(--acc);box-shadow:0 6px 0 var(--acc-d);transition:transform .07s ease,box-shadow .07s ease;margin-bottom:6px;touch-action:manipulation}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--acc-d)}
.btn:disabled{filter:grayscale(.6);opacity:.55;transform:none}
.btn.ok{background:var(--ok);box-shadow:0 6px 0 var(--ok-d)}.btn.ok:active{box-shadow:0 1px 0 var(--ok-d)}
.btn.bad{background:var(--bad);box-shadow:0 6px 0 var(--bad-d)}.btn.bad:active{box-shadow:0 1px 0 var(--bad-d)}
.btn.ghost{background:#fff;color:var(--acc);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.chip{font-weight:800;font-size:15px;border-radius:14px;padding:8px 12px;background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);transition:transform .07s,box-shadow .07s;white-space:nowrap}
.chip:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.chip.acc{background:var(--acc);color:#fff;border-color:var(--acc-d);box-shadow:0 3px 0 var(--acc-d)}
.chip:disabled{opacity:.5;transform:none}
.link{background:none;border:none;color:var(--acc);font-weight:900;font-size:16px;padding:14px;display:block;margin:4px auto}
.field{width:100%;font-weight:800;font-size:16px;border:2px solid var(--line);background:#F8F9FF;border-radius:16px;padding:14px;margin:8px 0;-webkit-user-select:text;user-select:text}
.field:focus{outline:0;border-color:var(--acc);background:#fff}
/* top bar */
.fm-top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;margin:calc(-1 * var(--sat)) -16px 14px;padding:calc(var(--sat) + 10px) 16px 10px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:2px solid var(--line)}
.fm-back,.fm-ico{flex:none;width:46px;height:46px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--acc);font:900 24px/1 Nunito,sans-serif;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center;transition:transform .07s,box-shadow .07s}
.fm-back:active,.fm-ico:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.fm-back{background:var(--acc);color:#fff;border-color:var(--acc-d);box-shadow:0 4px 0 var(--acc-d)}
.fm-ttl{flex:1;min-width:0}
.fm-ttl b{display:block;font:800 16px/1.15 Unbounded,Nunito,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm-ttl span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm-cnt{font:800 15px Unbounded,sans-serif;color:var(--acc);background:var(--tint);border-radius:12px;padding:8px 10px}
.fm-prog{position:absolute;left:0;right:0;bottom:-2px;height:4px}
.fm-prog i{display:block;height:100%;background:var(--acc);transition:width .4s ease}
/* home */
.fm-hero{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
.fm-hero h1{margin:0;font-size:21px;line-height:1.15}
.avatar{width:64px;height:64px;border-radius:50%;flex:none;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:34px;border:3px solid #fff;box-shadow:0 0 0 3px var(--acc)}
.fm-pills{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.fm-pill{font-weight:900;font-size:13px;padding:4px 9px;white-space:nowrap;border-radius:99px;background:#fff;border:2px solid var(--line)}
.fm-rail{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 10px;margin:0 -16px 6px;scrollbar-width:none}
.fm-rail::-webkit-scrollbar{display:none}
.fm-sub{flex:none;width:92px;min-height:92px;border-radius:22px;border:2px solid var(--line);background:#fff;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 5px;font:800 12.5px/1.1 Nunito,sans-serif;overflow-wrap:anywhere;color:var(--ink);transition:transform .07s,box-shadow .07s;text-align:center}
.fm-sub i{font-style:normal;font-size:32px;line-height:1}
.fm-sub:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.fm-sub.on,.fm-sub.fill{background:var(--sc);color:#fff;border-color:var(--scd);box-shadow:0 5px 0 var(--scd)}
.fm-sub.fill:active{box-shadow:0 1px 0 var(--scd)}
.fm-today{position:relative;overflow:hidden;border-radius:28px;padding:20px 18px 18px;margin:4px 0 16px;color:#fff;background:var(--sc,var(--acc));box-shadow:0 7px 0 var(--scd,var(--acc-d))}
.fm-today::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.fm-today::before{content:"";position:absolute;right:40px;top:70px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.10)}
.fm-today>*{position:relative;z-index:1}
.fm-today .lbl{font-weight:800;opacity:.92;font-size:15px}
.fm-today .big{font:800 46px/1 Unbounded,sans-serif;margin:8px 0 10px}
.fm-today .big small{font-size:20px;opacity:.85}
.fm-today .bar{height:12px;background:rgba(255,255,255,.35);border-radius:99px;overflow:hidden}
.fm-today .bar>i{display:block;height:100%;background:#fff;border-radius:99px}
.fm-today .comp{font-size:14px;opacity:.95;margin:10px 0 14px}
.fm-today .btn{background:#fff;color:var(--scd,var(--acc-d));box-shadow:0 6px 0 rgba(0,0,0,.22);margin:0}
.fm-today .btn:active{box-shadow:0 1px 0 rgba(0,0,0,.22)}
.fm-today .fox{position:absolute;right:10px;top:8px;opacity:.95}
.fm-sec{font:800 15px Unbounded,sans-serif;margin:18px 2px 8px}
/* profiles */
.fm-brand{font:800 30px/1.05 Unbounded,sans-serif;margin:24px 0 6px}
.fm-kid{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;border-radius:28px;padding:18px;margin:0 0 16px;color:#fff;border:0;width:100%;text-align:left;background:var(--k);box-shadow:0 7px 0 var(--kd);transition:transform .07s,box-shadow .07s}
.fm-kid:active{transform:translateY(6px);box-shadow:0 1px 0 var(--kd)}
.fm-kid b{display:block;font:800 20px/1.15 Unbounded,sans-serif}
.fm-kid span{opacity:.9;font-size:14px;display:block}
.fm-kid .av{width:68px;height:68px;border-radius:50%;flex:none;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:34px;border:3px solid rgba(255,255,255,.7)}
.fm-kid::after{content:"";position:absolute;right:-30px;bottom:-50px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
/* path */
.nodes{position:relative;padding:48px 0 4px}
.nw{position:relative;display:flex;justify-content:center;width:96px;margin:0 auto 30px;transform:translateX(var(--x))}
.node{width:76px;height:68px;border-radius:50%;border:0;background:var(--c);box-shadow:0 8px 0 var(--cd);color:#fff;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;transition:transform .07s,box-shadow .07s}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 var(--cd)}
.node.locked{background:#E4E6F3;box-shadow:0 8px 0 #C9CCE0;color:#A3A7C2}
.nw.cur .node{outline:7px solid var(--line);outline-offset:7px}
.bub{position:absolute;top:-56px;background:#fff;border:2px solid var(--line);color:var(--c);padding:8px 14px;border-radius:14px;font:800 13px Unbounded,sans-serif;animation:bob 1s ease-in-out infinite alternate;white-space:nowrap;z-index:2;box-shadow:0 3px 0 var(--line)}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.pfox{position:absolute;top:110px;pointer-events:none}
/* quests / family */
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.qrow{padding:10px 0;border-bottom:2px dashed var(--line)}
.qrow:last-child{border-bottom:0;padding-bottom:0}
.qbar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.qbar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.mini-av{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;border:3px solid #fff;box-shadow:0 0 0 3px var(--k)}
/* lesson */
.lbar{height:16px;background:var(--line);border-radius:99px;overflow:hidden;margin:2px 0 4px}
.lbar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .4s}
.combo{height:24px;text-align:center;color:#F97316;font:800 14px Unbounded,sans-serif;opacity:0}
.combo.on{opacity:1;animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.ex-title{font-size:21px;line-height:1.2;margin:6px 0 18px}
.say-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:22px}
.bubble{position:relative;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:20px;padding:12px 14px;font-size:18px;flex:1}
.bubble .sub{color:var(--muted);font-size:14px;margin-top:6px}
.mini-spk{background:none;border:none;font-size:18px;padding:0 6px 0 0}
.answer{min-height:116px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);background:repeating-linear-gradient(transparent 0 56px,var(--line) 56px 58px);display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;padding:6px 0;margin-bottom:28px}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.slot{display:inline-block;border-radius:14px;background:var(--line)}
.tile{background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:14px;padding:10px 14px;font-size:17px;font-weight:800;color:var(--ink);transition:transform .07s,box-shadow .07s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile.used{visibility:hidden}
.tile.sel,.pic.sel{border-color:var(--acc);background:var(--tint);box-shadow:0 4px 0 var(--acc)}
.tile.ok{border-color:var(--ok);background:#DCFCE7;box-shadow:0 4px 0 var(--ok-d);color:var(--ok-d)}
.tile.bad{border-color:var(--bad);background:#FFE4E6;box-shadow:0 4px 0 var(--bad-d);color:var(--bad-d);animation:shake .3s}
.tile.done{opacity:.35;pointer-events:none;background:#fff;color:#A3A7C2;border-color:var(--line);box-shadow:none}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.audio-row{display:flex;gap:14px;justify-content:center;margin:6px 0 26px}
.spk{width:110px;height:110px;border-radius:28px;border:0;background:var(--acc);box-shadow:0 6px 0 var(--acc-d);font-size:48px;color:#fff;transition:transform .07s,box-shadow .07s}
.spk.slow{width:76px;height:76px;font-size:32px;align-self:flex-end;border-radius:22px}
.spk:active{transform:translateY(5px);box-shadow:0 1px 0 var(--acc-d)}
.pic-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pic{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);padding:18px 8px;text-align:center;color:var(--ink);transition:transform .07s,box-shadow .07s}
.pic:active{transform:translateY(4px)}
.pic .emo{font-size:56px;line-height:1.2}
.pic .cw{font-size:17px;font-weight:800;margin-top:8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
.tile.m{padding:15px 8px;text-align:center}
.mic{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:2px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);background:#fff;color:var(--acc);font-size:18px;font-weight:900;padding:22px;margin-top:10px;transition:transform .07s,box-shadow .07s}
.mic:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.mic.rec{border-color:var(--acc);background:var(--tint);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(47,107,255,.18)}}
.heard{text-align:center;color:var(--muted);margin-top:14px;min-height:22px}
.foot,.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:16px 16px calc(18px + env(safe-area-inset-bottom));z-index:30}
.foot{background:rgba(255,255,255,.92);border-top:2px solid var(--line)}
.sheet{animation:up .2s ease-out;border-top:2px solid transparent}
.sheet.ok{background:#DCFCE7;border-color:#A7E8BC}.sheet.bad{background:#FFE4E6;border-color:#FBC3C8}
.s-head{font:800 21px Unbounded,sans-serif;margin-bottom:8px}
.sheet.ok .s-head,.sheet.ok .s-ans{color:var(--ok-d)}.sheet.bad .s-head,.sheet.bad .s-ans,.sheet.bad .s-lbl{color:var(--bad-d)}
.s-lbl{font-weight:900;font-size:17px}
.s-ans{font-size:17px;margin:2px 0 14px}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
/* end / streak */
.center{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 20px}
.big2{font:800 26px/1.15 Unbounded,sans-serif;color:var(--acc);margin:12px 0 20px}
.stats{display:flex;gap:10px;width:100%}
.stat{flex:1;border:2px solid var(--c);border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 4px 0 var(--c)}
.stat .h{background:var(--c);color:#fff;font-size:12px;font-weight:900;padding:6px}
.stat .v{font:800 18px Unbounded,sans-serif;color:var(--c);padding:12px 4px}
.flame{font-size:110px;animation:pop .6s}
.streaknum{font:800 72px/1 Unbounded,sans-serif;color:#F97316}
/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(30,27,75,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.ov.mid{align-items:center}
@keyframes fade{from{opacity:0}}
.mod{background:#fff;width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));text-align:center;animation:up2 .2s}
.ov.mid .mod{border-radius:28px;width:90%;max-width:400px;box-shadow:0 7px 0 var(--line)}
@keyframes up2{from{transform:translateY(60px);opacity:0}}
.mod.pop{background:var(--c);color:#fff;text-align:left}
.mod.pop .t{font:800 20px Unbounded,sans-serif}
.mod.pop .s{opacity:.9;margin:6px 0 16px}
.mod.pop .btn{background:#fff;color:var(--cd);box-shadow:0 6px 0 rgba(0,0,0,.22)}
.mtitle{font:800 19px/1.25 Unbounded,sans-serif;margin:10px 0 16px}
.chest{font-size:110px;display:inline-block}
.chest.shake{animation:cshake .5s 2}
@keyframes cshake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:16px;z-index:60;font-size:16px;font-weight:800;max-width:90%;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.25);animation:fade .2s}
/* call */
.call-av{display:flex;flex-direction:column;align-items:center;padding:4px 0 8px}
.ring{border-radius:50%;padding:10px}
.ring.talk{animation:talk 1s infinite}
@keyframes talk{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.35)}50%{box-shadow:0 0 0 18px rgba(249,115,22,.08)}}
.status{color:var(--muted);font-size:16px;margin-top:6px;min-height:22px;text-align:center}
.chat{padding-bottom:190px}
.msg{max-width:85%;padding:11px 14px;border-radius:20px;margin:8px 0;font-size:16px;line-height:1.35;-webkit-user-select:text;user-select:text}
.msg.ai{background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.msg.me{background:var(--tint);border:2px solid var(--acc);margin-left:auto}
.bigmic{width:84px;height:84px;border-radius:50%;border:0;background:var(--acc);box-shadow:0 6px 0 var(--acc-d);font-size:38px;color:#fff;display:block;margin:0 auto;transition:transform .07s,box-shadow .07s}
.bigmic:active{transform:translateY(5px);box-shadow:0 1px 0 var(--acc-d)}
.bigmic.rec{background:var(--bad);box-shadow:0 6px 0 var(--bad-d);animation:pulse 1s infinite}
.bigmic:disabled{filter:grayscale(.7);opacity:.5}
.trow{display:flex;gap:8px;margin-top:10px;align-items:center}
.trow .field{margin:0}
.fb{text-align:left;white-space:pre-wrap;font-size:16px;line-height:1.5;-webkit-user-select:text;user-select:text}
/* swipe + confetti */
#fm-swipe{position:fixed;left:-56px;top:45%;width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;z-index:60;display:flex;align-items:center;justify-content:center;font:900 26px Nunito,sans-serif;box-shadow:0 4px 0 var(--acc-d);pointer-events:none;opacity:0}
.fm-conf{position:fixed;top:-12px;width:10px;height:14px;border-radius:3px;z-index:70;pointer-events:none;animation:fmfall linear forwards}
@keyframes fmfall{to{transform:translateY(105vh) rotate(720deg)}}
.fm-today .tch-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip.tch{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.55);box-shadow:none}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ptile{border:0;border-radius:24px;padding:18px 12px;background:var(--sc);box-shadow:0 6px 0 var(--scd);color:#fff;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:132px;transition:transform .07s,box-shadow .07s}
.ptile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--scd)}
.ptile i{font-style:normal;font-size:36px;line-height:1.1}
.ptile b{font:800 16px Unbounded,sans-serif;margin-top:auto}
.ptile span{font-size:13px;opacity:.9}
.rbtn{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);padding:16px;margin-bottom:12px;color:var(--ink);transition:transform .07s,box-shadow .07s}
.rbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.rbtn .ri{font-size:36px}.rbtn b{display:block;font:800 15px Unbounded,sans-serif;margin-bottom:2px}.rbtn .small{display:block}
.rs{font-size:14px;white-space:nowrap}
.rnum{width:30px;height:30px;border-radius:10px;background:var(--c);color:#fff;font:800 15px Unbounded,sans-serif;display:flex;align-items:center;justify-content:center;float:left;margin:0 10px 4px 0}
.rt{font-size:17px;line-height:1.25;margin:2px 0 10px}
.rx{font-size:16px;line-height:1.45;margin-bottom:10px;clear:both}
.exr{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:2px dashed var(--line)}
.spk-s{flex:none;width:42px;height:42px;border-radius:14px;border:0;background:var(--acc);box-shadow:0 4px 0 var(--acc-d);font-size:18px;color:#fff;transition:transform .07s,box-shadow .07s}
.spk-s:active{transform:translateY(4px);box-shadow:0 0 0 var(--acc-d)}
.why{font-size:15px;line-height:1.4;color:var(--bad-d);margin:0 0 10px;font-weight:700}

function weekKey(){const d=new Date();const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function plural(n,a,b,c){const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<10||m100>=20))?b:c}

function humanDate(){const s=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});return s.charAt(0).toUpperCase()+s.slice(1)}

/* ===================== SOUND & SPEECH ===================== */
let AC=null;
function tone(fr,dur,type,gap,vol){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;fr.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const st=t0+i*gap;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(vol,st+.01);g.gain.exponentialRampToValueAtTime(.001,st+dur);o.connect(g);g.connect(AC.destination);o.start(st);o.stop(st+dur+.03)})}catch(e){}}
const SND={ok:()=>tone([660,990],.2,'sine',.1,.2),bad:()=>tone([200,160],.28,'square',.13,.07),tap:()=>tone([520],.06,'sine',0,.07),pair:()=>tone([700],.12,'sine',0,.15),win:()=>tone([523,659,784,1047],.3,'triangle',.13,.2),chest:()=>tone([392,523,659,784,1047,1319],.22,'triangle',.08,.18),combo:()=>tone([784,988,1175],.15,'triangle',.07,.15)};
let VOICE=null;
function pickVoice(){const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/en[-_]US/i.test(v.lang)&&/google/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function hush(){try{speechSynthesis.cancel()}catch(e){}}
function say(t,rate){return new Promise(res=>{if(!('speechSynthesis' in window))return res();try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=rate||S.rate;u.onend=res;u.onerror=res;speechSynthesis.speak(u)}catch(e){res()}})}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let REC=null;
function stopRec(){if(REC)try{REC.abort()}catch(e){}}
function listenOnce(){return new Promise((res,rej)=>{if(!SR)return rej('nosr');const r=new SR();REC=r;r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;let got=false;r.onresult=e=>{got=true;res([...e.results[0]].map(a=>a.transcript))};r.onerror=e=>{if(!got)rej(e.error||'err')};r.onend=()=>{REC=null;if(!got)rej('nospeech')};try{r.start()}catch(e){rej('busy')}})}

/* ===================== PROGRESS ===================== */
function ensureQuest(){const p=P(),t=today();if(p.quest.day!==t)p.quest={day:t,xp:0,lessons:0,calls:0,claimed:{}}}
function streakOf(p){if(!p.lastDay)return 0;const d=dayDiff(p.lastDay,today());if(d<=1)return p.streak;if(d===2&&p.freezes>0)return p.streak;return 0}
function touchDay(){const p=P(),t=today();if(p.lastDay===t)return false;const d=p.lastDay?dayDiff(p.lastDay,t):99;if(d===1)p.streak++;else if(d===2&&p.freezes>0){p.freezes--;p.streak++}else p.streak=1;p.best=Math.max(p.best,p.streak);p.lastDay=t;p.days=(p.days||[]).concat(t).slice(-400);return true}
function addXP(n){ensureQuest();const nd=touchDay();const p=P();p.xp+=n;p.quest.xp+=n;const wk=weekKey();if(!p.week||p.week.key!==wk)p.week={key:wk,xp:0};p.week.xp+=n;save();scheduleReminders();return nd}
function curIdx(){const p=P();const i=NODES.findIndex(n=>!p.done[n.id]);return i<0?NODES.length:i}
function recordMistake(e){const en=e.answer||e.text,ru=e.ru||e.prompt;if(!en||!ru)return;const p=P();if(!p.mistakes.some(m=>m[0]===en)){p.mistakes.push([en,ru]);if(p.mistakes.length>30)p.mistakes.shift()}}

let depth=0,ignorePop=0,_inPop=false;

function syncHistory(){const Lv=level();try{while(depth<Lv){depth++;history.pushState({fmd:depth},'')}if(depth>Lv){ignorePop++;history.go(Lv-depth);depth=Lv}}catch(e){}}
window.addEventListener('popstate',e=>{

  depth=(e.state&&e.state.fmd)||0;
  if(level()>depth){_inPop=true;fmBack();_inPop=false;if(level()>depth)syncHistory()}
});

(function(){
  let sx=0,sy=0,st=0,on=false,ind=null;
  function ui(){if(!ind){ind=document.createElement('div');ind.id='fm-swipe';ind.textContent='←';document.body.appendChild(ind)}return ind}
  document.addEventListener('touchstart',e=>{
    if(level()===0||e.touches.length!==1){on=false;return}
    const t=e.target;if(t.closest&&t.closest('input,textarea,select,.fm-rail,.fm-noswipe')){on=false;return}
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();on=true},{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!on)return;const dx=e.touches[0].clientX-sx,dy=Math.abs(e.touches[0].clientY-sy);
    if(dy>60&&dy>dx){on=false;ui().style.opacity=0;return}
    if(dx>10){const k=Math.min(dx/110,1);const el=ui();el.style.opacity=k;el.style.transform='translateX('+(k*76)+'px) scale('+(0.7+0.3*k)+')'}},{passive:true});
  document.addEventListener('touchend',e=>{
    if(!on)return;on=false;const dx=e.changedTouches[0].clientX-sx,dy=Math.abs(e.changedTouches[0].clientY-sy);
    const el=ui();el.style.transition='opacity .2s,transform .2s';el.style.opacity=0;el.style.transform='translateX(0)';setTimeout(()=>el.style.transition='',220);
    if(dx>110&&dy<70&&Date.now()-st<900)goBackUI()},{passive:true});
})();

 if(!(d===0&&(done||t<=now)))list.push({id:1+d,title:'FamLingo · '+p.nameRu,body:RTEXT[d]+(st&&d<2?' Серия: 🔥'+st:''),schedule:{at:t,allowWhileIdle:true}});

/* ===================== LESSON BUILD ===================== */
function distract(target,pool,n){const t=new Set(words(target).map(w=>w.toLowerCase()));return shuffle([...new Set(pool.filter(w=>!t.has(w.toLowerCase())))]).slice(0,n)}
function mkBuild(type,en,ru,pool){return {type,answer:en,prompt:ru,ru,tiles:shuffle(words(en).concat(distract(en,pool,3)))}}
function buildLesson(lesson){const ph=lesson.phrases.map(p=>[tx(p[0]),tx(p[1])]),W=lesson.words;const pool=ph.flatMap(p=>words(p[0]));
const wi=shuffle([...W.keys()]),pi=shuffle([...ph.keys()]);
const pic=j=>{const ans=W[wi[j]];const opts=shuffle([ans].concat(shuffle(W.filter(w=>w!==ans)).slice(0,3)));return {type:'pic',prompt:ans[1],answer:ans[0],options:opts}};
const B=j=>mkBuild('build',ph[pi[j]][0],ph[pi[j]][1],pool),Ls=j=>mkBuild('listen',ph[pi[j]][0],ph[pi[j]][1],pool),Sp=j=>({type:'speak',text:ph[pi[j]][0],ru:ph[pi[j]][1]});
return [pic(0),B(0),Ls(2),pic(1),B(1),{type:'match',pairs:shuffle(W).slice(0,5)},Sp(0),B(3),Ls(4),B(5),Sp(3),Ls(6)]}
function buildMistakes(){const p=P();const m=shuffle(p.mistakes).slice(0,8);const pool=COURSE.flatMap(u=>u.lessons.flatMap(l=>l.phrases.flatMap(x=>words(tx(x[0])))));
const items=m.map((x,i)=>Object.assign(mkBuild(i%2?'listen':'build',x[0],x[1],pool),{fromMistake:true}));if(m.length)items.push({type:'speak',text:m[0][0],ru:m[0][1],fromMistake:true});return items}

let L=null;
function startLesson(i,mode){const n=NODES[i];const items=buildLesson(n.lesson);L={node:n,mode,items,idx:0,correct:0,total:items.length,combo:0,maxCombo:0,wrong:0,start:Date.now(),title:n.lesson.title,sub:COURSE[n.unit].title};lessonShell()}
function startMistakes(){if(!P().mistakes.length)return toast('Ошибок пока нет — отлично!');L={node:null,mode:'mistakes',items:buildMistakes(),idx:0,correct:0,combo:0,maxCombo:0,wrong:0,start:Date.now(),title:'Работа над ошибками',sub:'Повторение'};L.total=L.items.length;lessonShell()}
function randomReplay(){const p=P();const d=NODES.map((n,i)=>[n,i]).filter(x=>x[0].type==='lesson'&&p.done[x[0].id]);if(!d.length)return toast('Сначала пройдите хотя бы один урок');startLesson(d[rnd(0,d.length-1)][1],'replay')}
function lessonShell(){show('lesson',`<div class="lbar"><i id="fill"></i></div><div class="combo" id="combo"></div><div id="lbody"></div><div class="foot" id="lfoot"><button class="btn ok" id="chk" disabled onclick="doCheck()">Проверить</button></div><div id="sheet"></div>`,{title:L.title,sub:L.sub,cnt:'1/'+L.total,prog:0});renderEx()}
function quitLesson(){modal(`${fox(90)}<div class="mtitle">Подождите, не уходите! Если выйти сейчас, прогресс урока пропадёт.</div><button class="btn" onclick="closeModal()">Продолжить урок</button><button class="link" style="color:var(--bad)" onclick="closeModal();goHome()">Выйти</button>`,true)}
function setReady(on,showFoot){const c=document.getElementById('chk'),f=document.getElementById('lfoot');if(f)f.style.display=showFoot===false?'none':'block';if(c)c.disabled=!on}
const lb=h=>document.getElementById('lbody').innerHTML=h;
function updateBar(){const pct=Math.min(100,100*L.correct/L.total);const f=document.getElementById('fill');if(f)f.style.width=pct+'%';const g=document.getElementById('fmprog');if(g)g.style.width=pct+'%';const c=document.getElementById('fmcnt');if(c)c.textContent=Math.min(L.correct+1,L.total)+'/'+L.total}
function renderEx(){const e=L.items[L.idx];L.answered=false;L.check=null;L.speakFails=0;document.getElementById('sheet').innerHTML='';setReady(false,true);updateBar();
if(e.type==='pic')exPic(e);else if(e.type==='build'||e.type==='listen')exBuild(e);else if(e.type==='match')exMatch(e);else exSpeak(e);window.scrollTo(0,0)}
function exPic(e){lb(`<h2 class="ex-title">Выберите «${esc(e.prompt)}»</h2><div class="pic-grid">${e.options.map((o,i)=>`<button class="pic" onclick="pickCard(${i})"><div class="emo">${o[2]}</div><div class="cw">${esc(o[0])}</div></button>`).join('')}</div>`);L.sel=null;L.check=()=>({ok:e.options[L.sel][0]===e.answer,answer:e.answer,user:e.options[L.sel][0]})}
function pickCard(i){if(L.answered)return;L.sel=i;document.querySelectorAll('.pic').forEach((c,j)=>c.classList.toggle('sel',j===i));say(L.items[L.idx].options[i][0]);setReady(true)}
function exBuild(e){const listen=e.type==='listen';
const head=listen?`<h2 class="ex-title">Нажмите, что услышали</h2><div class="audio-row"><button class="spk" onclick="say(L.items[L.idx].answer)">🔊</button><button class="spk slow" onclick="say(L.items[L.idx].answer,0.6)">🐢</button></div>`:`<h2 class="ex-title">Переведите предложение</h2><div class="say-row">${fox(78)}<div class="bubble">${esc(e.prompt)}</div></div>`;
lb(head+`<div class="answer" id="ans"></div><div class="bank">${e.tiles.map((t,i)=>`<span class="slot"><button class="tile" id="t${i}" onclick="tapTile(${i})">${esc(t)}</button></span>`).join('')}</div>`);
L.chosen=[];L.check=()=>{const u=L.chosen.map(i=>e.tiles[i]).join(' ');return {ok:norm(u)===norm(e.answer),answer:e.answer,user:u}};if(listen)setTimeout(()=>say(e.answer),400)}
function tapTile(i){if(L.answered)return;const e=L.items[L.idx];const k=L.chosen.indexOf(i);if(k>=0)L.chosen.splice(k,1);else{L.chosen.push(i);if(e.type==='build')say(e.tiles[i])}SND.tap();
document.getElementById('ans').innerHTML=L.chosen.map(j=>`<button class="tile" onclick="tapTile(${j})">${esc(e.tiles[j])}</button>`).join('');e.tiles.forEach((t,j)=>document.getElementById('t'+j).classList.toggle('used',L.chosen.includes(j)));setReady(L.chosen.length>0)}
function exMatch(e){const L1=e.pairs.map((p,i)=>[p[0],i]),R=shuffle(e.pairs.map((p,i)=>[p[1],i]));const btn=(x,s)=>`<button class="tile m" data-s="${s}" data-k="${x[1]}" onclick="tapMatch(this)">${esc(x[0])}</button>`;
lb(`<h2 class="ex-title">Найдите пары</h2><div class="match"><div class="col">${L1.map(x=>btn(x,'en')).join('')}</div><div class="col">${R.map(x=>btn(x,'ru')).join('')}</div></div>`);L.msel=null;L.mleft=e.pairs.length;L.mwrong=0;setReady(false,false)}
function tapMatch(b){if(L.answered||b.classList.contains('ok'))return;if(b.dataset.s==='en')say(b.textContent);
if(!L.msel||L.msel.dataset.s===b.dataset.s){if(L.msel)L.msel.classList.remove('sel');L.msel=b;b.classList.add('sel');SND.tap();return}

modal(`<div class="chest">${leg?'👑':'⏩'}</div><div class="mtitle">${leg?'Легендарный уровень':'Перейти к юниту «'+esc(COURSE[ui].title)+'»?'}</div><div class="small" style="margin-bottom:16px">${leg?items.length+' заданий по всему юниту. Можно ошибиться только 1 раз. Награда — золотой юнит и +40 XP.':items.length+' заданий. Не больше 3 ошибок — и все предыдущие юниты будут засчитаны.'}</div><button class="btn" onclick="closeModal();lessonShell()">Начать тест</button><button class="link" onclick="closeModal();L=null">Не сейчас</button>`,true)}
function failTest(){const leg=L.mode==='legend',ui=L.unit;SND.bad();
show('end',`<div class="center">${fox(130)}<div class="big2" style="color:var(--bad)">Почти получилось!</div><div class="card" style="width:100%">Ошибок больше, чем ${L.maxWrong}. ${leg?'Повторите уроки юнита и попробуйте снова — золото того стоит.':'Пройдите юнит по порядку или попробуйте тест ещё раз.'}</div></div><div class="foot"><button class="btn" onclick="startTest('${L.mode}',${ui})">Ещё раз</button><button class="link" onclick="goHome()">На главную</button></div>`,{title:'Тест не пройден',sub:COURSE[ui].title});L.finished=true}

async function explain(){const r=L.lastR,e=L.items[L.idx];const w=document.getElementById('why'),b=document.querySelector('.why-b');if(!w||w.dataset.on)return;w.dataset.on=1;if(b)b.remove();
if(!S.key){w.textContent='Нужен ключ Gemini в ⚙️ Настройках.';return}w.textContent='Лекси объясняет…';
const task=e.type==='pic'?'выбрать английское слово для «'+e.prompt+'»':e.type==='speak'?'произнести фразу «'+e.text+'» ('+e.ru+')':e.type==='listen'?'записать услышанную фразу':'перевести на английский: «'+e.prompt+'»';
const q=`Задание: ${task}.\nОтвет ученика: «${r.user||'—'}».\nПравильный ответ: «${r.answer}».\nОбъясни по-русски, в чём ошибка ученика и какое правило здесь работает. 2–3 коротких предложения, до 50 слов, без вступлений и без повтора задания.`;
try{const t=await gemini('Ты добрый и точный учитель английского для взрослого русскоязычного ученика уровня A2.',[{role:'user',text:q}],1024);if(document.getElementById('why')===w)w.textContent='🦊 '+t}catch(err){w.textContent='Не получилось: '+err.message}}

function renderRoles(){const p=P();
show('roles',`<div class="small" style="margin:0 2px 12px">Ролевые диалоги с Лекси. У каждой сценки свои цели — в конце звёзды и разбор ошибок.</div>`+ROLES.map(r=>{const s=p.roles[r.id]||0;return `<button class="rbtn" onclick="startRole('${r.id}')"><span class="ri">${r.ico}</span><span class="grow"><b>${esc(r.title)}</b><span class="small">${esc(r.sub)}</span></span><span class="rs">${'⭐'.repeat(s)}${'<span style="opacity:.3">⭐</span>'.repeat(3-s)}</span></button>`}).join(''),{title:'Сценки',sub:'Ролевые диалоги'})}
function startRole(id){const r=ROLES.find(x=>x.id===id);
startConv({kind:'role',role:r,topic:r.scene+' The learner has these goals: '+r.goals.join('; ')+'. Play your role naturally, stay in the scene, and lead the learner step by step through the goals without listing them.',title:r.ico+' '+r.title,sub:'Сценка'})}

render();bgPull(true);
</script>
