<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>FamLingo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--acc:#2F6BFF;--acc-d:#1847C2;--acc2:#00A88F;--acc2-d:#007F6C;--tint:#E8EFFF;--ink:#1E1B4B;--line:#E4E6F3;--muted:#6B6F8E;--ok:#16A34A;--ok-d:#15803D;--bad:#E5484D;--bad-d:#BE123C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,-apple-system,Roboto,sans-serif;font-weight:700;color:var(--ink);background:#F4F5FF;min-height:100vh;-webkit-user-select:none;user-select:none}
body[data-kid="chingiz"]{background:repeating-linear-gradient(180deg,#DFF2E3 0 56px,#EEF8F0 56px 112px) fixed}
body[data-kid="tamina"]{background:linear-gradient(170deg,#FFE6F0 0%,#FFF7FA 40%,#FFF1D6 100%) fixed}
body[data-kid="sagi"]{background:linear-gradient(170deg,#EFE8FF 0%,#FAF8FF 45%,#FFF3E3 100%) fixed}
button,input{font-family:inherit}
#app{max-width:480px;margin:0 auto}
.phone{padding:var(--sat) 16px 130px;min-height:100vh;overflow-x:clip}
h1,h2,.uf{font-family:Unbounded,Nunito,system-ui,sans-serif;font-weight:800;letter-spacing:-.4px}
.muted{color:var(--muted);font-weight:700}
.small{font-size:14px;color:var(--muted)}
.card{background:#fff;border-radius:24px;padding:16px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);margin-bottom:14px}
/* tactile buttons */
.btn{display:block;width:100%;font-weight:900;font-size:18px;border-radius:18px;padding:16px;border:0;color:#fff;background:var(--acc);box-shadow:0 6px 0 var(--acc-d);transition:transform .07s ease,box-shadow .07s ease;margin-bottom:6px;touch-action:manipulation}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--acc-d)}
.btn:disabled{filter:grayscale(.6);opacity:.55;transform:none}
.btn.ok{background:var(--ok);box-shadow:0 6px 0 var(--ok-d)}.btn.ok:active{box-shadow:0 1px 0 var(--ok-d)}
.btn.bad{background:var(--bad);box-shadow:0 6px 0 var(--bad-d)}.btn.bad:active{box-shadow:0 1px 0 var(--bad-d)}
.btn.ghost{background:#fff;color:var(--acc);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.chip{font-weight:800;font-size:15px;border-radius:14px;padding:8px 12px;background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);transition:transform .07s,box-shadow .07s;white-space:nowrap}
.chip:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.chip.acc{background:var(--acc);color:#fff;border-color:var(--acc-d);box-shadow:0 3px 0 var(--acc-d)}
.chip:disabled{opacity:.5;transform:none}
.link{background:none;border:none;color:var(--acc);font-weight:900;font-size:16px;padding:14px;display:block;margin:4px auto}
.field{width:100%;font-weight:800;font-size:16px;border:2px solid var(--line);background:#F8F9FF;border-radius:16px;padding:14px;margin:8px 0;-webkit-user-select:text;user-select:text}
.field:focus{outline:0;border-color:var(--acc);background:#fff}
/* top bar */
.fm-top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;margin:calc(-1 * var(--sat)) -16px 14px;padding:calc(var(--sat) + 10px) 16px 10px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:2px solid var(--line)}
.fm-back,.fm-ico{flex:none;width:46px;height:46px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--acc);font:900 24px/1 Nunito,sans-serif;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center;transition:transform .07s,box-shadow .07s}
.fm-back:active,.fm-ico:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.fm-back{background:var(--acc);color:#fff;border-color:var(--acc-d);box-shadow:0 4px 0 var(--acc-d)}
.fm-ttl{flex:1;min-width:0}
.fm-ttl b{display:block;font:800 16px/1.15 Unbounded,Nunito,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm-ttl span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm-cnt{font:800 15px Unbounded,sans-serif;color:var(--acc);background:var(--tint);border-radius:12px;padding:8px 10px}
.fm-prog{position:absolute;left:0;right:0;bottom:-2px;height:4px}
.fm-prog i{display:block;height:100%;background:var(--acc);transition:width .4s ease}
/* home */
.fm-hero{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
.fm-hero h1{margin:0;font-size:21px;line-height:1.15}
.avatar{width:64px;height:64px;border-radius:50%;flex:none;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:34px;border:3px solid #fff;box-shadow:0 0 0 3px var(--acc)}
.fm-pills{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.fm-pill{font-weight:900;font-size:13px;padding:4px 9px;white-space:nowrap;border-radius:99px;background:#fff;border:2px solid var(--line)}
.fm-rail{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 10px;margin:0 -16px 6px;scrollbar-width:none}
.fm-rail::-webkit-scrollbar{display:none}
.fm-sub{flex:none;width:92px;min-height:92px;border-radius:22px;border:2px solid var(--line);background:#fff;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 5px;font:800 12.5px/1.1 Nunito,sans-serif;overflow-wrap:anywhere;color:var(--ink);transition:transform .07s,box-shadow .07s;text-align:center}
.fm-sub i{font-style:normal;font-size:32px;line-height:1}
.fm-sub:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.fm-sub.on,.fm-sub.fill{background:var(--sc);color:#fff;border-color:var(--scd);box-shadow:0 5px 0 var(--scd)}
.fm-sub.fill:active{box-shadow:0 1px 0 var(--scd)}
.fm-today{position:relative;overflow:hidden;border-radius:28px;padding:20px 18px 18px;margin:4px 0 16px;color:#fff;background:var(--sc,var(--acc));box-shadow:0 7px 0 var(--scd,var(--acc-d))}
.fm-today::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.fm-today::before{content:"";position:absolute;right:40px;top:70px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.10)}
.fm-today>*{position:relative;z-index:1}
.fm-today .lbl{font-weight:800;opacity:.92;font-size:15px}
.fm-today .big{font:800 46px/1 Unbounded,sans-serif;margin:8px 0 10px}
.fm-today .big small{font-size:20px;opacity:.85}
.fm-today .bar{height:12px;background:rgba(255,255,255,.35);border-radius:99px;overflow:hidden}
.fm-today .bar>i{display:block;height:100%;background:#fff;border-radius:99px}
.fm-today .comp{font-size:14px;opacity:.95;margin:10px 0 14px}
.fm-today .btn{background:#fff;color:var(--scd,var(--acc-d));box-shadow:0 6px 0 rgba(0,0,0,.22);margin:0}
.fm-today .btn:active{box-shadow:0 1px 0 rgba(0,0,0,.22)}
.fm-today .fox{position:absolute;right:10px;top:8px;opacity:.95}
.fm-sec{font:800 15px Unbounded,sans-serif;margin:18px 2px 8px}
/* profiles */
.fm-brand{font:800 30px/1.05 Unbounded,sans-serif;margin:24px 0 6px}
.fm-kid{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;border-radius:28px;padding:18px;margin:0 0 16px;color:#fff;border:0;width:100%;text-align:left;background:var(--k);box-shadow:0 7px 0 var(--kd);transition:transform .07s,box-shadow .07s}
.fm-kid:active{transform:translateY(6px);box-shadow:0 1px 0 var(--kd)}
.fm-kid b{display:block;font:800 20px/1.15 Unbounded,sans-serif}
.fm-kid span{opacity:.9;font-size:14px;display:block}
.fm-kid .av{width:68px;height:68px;border-radius:50%;flex:none;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:34px;border:3px solid rgba(255,255,255,.7)}
.fm-kid::after{content:"";position:absolute;right:-30px;bottom:-50px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
/* path */
.nodes{position:relative;padding:48px 0 4px}
.nw{position:relative;display:flex;justify-content:center;width:96px;margin:0 auto 30px;transform:translateX(var(--x))}
.node{width:76px;height:68px;border-radius:50%;border:0;background:var(--c);box-shadow:0 8px 0 var(--cd);color:#fff;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;transition:transform .07s,box-shadow .07s}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 var(--cd)}
.node.locked{background:#E4E6F3;box-shadow:0 8px 0 #C9CCE0;color:#A3A7C2}
.nw.cur .node{outline:7px solid var(--line);outline-offset:7px}
.bub{position:absolute;top:-56px;background:#fff;border:2px solid var(--line);color:var(--c);padding:8px 14px;border-radius:14px;font:800 13px Unbounded,sans-serif;animation:bob 1s ease-in-out infinite alternate;white-space:nowrap;z-index:2;box-shadow:0 3px 0 var(--line)}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.pfox{position:absolute;top:110px;pointer-events:none}
/* quests / family */
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.qrow{padding:10px 0;border-bottom:2px dashed var(--line)}
.qrow:last-child{border-bottom:0;padding-bottom:0}
.qbar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.qbar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.mini-av{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;border:3px solid #fff;box-shadow:0 0 0 3px var(--k)}
/* lesson */
.lbar{height:16px;background:var(--line);border-radius:99px;overflow:hidden;margin:2px 0 4px}
.lbar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .4s}
.combo{height:24px;text-align:center;color:#F97316;font:800 14px Unbounded,sans-serif;opacity:0}
.combo.on{opacity:1;animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.ex-title{font-size:21px;line-height:1.2;margin:6px 0 18px}
.say-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:22px}
.bubble{position:relative;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:20px;padding:12px 14px;font-size:18px;flex:1}
.bubble .sub{color:var(--muted);font-size:14px;margin-top:6px}
.mini-spk{background:none;border:none;font-size:18px;padding:0 6px 0 0}
.answer{min-height:116px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);background:repeating-linear-gradient(transparent 0 56px,var(--line) 56px 58px);display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;padding:6px 0;margin-bottom:28px}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.slot{display:inline-block;border-radius:14px;background:var(--line)}
.tile{background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:14px;padding:10px 14px;font-size:17px;font-weight:800;color:var(--ink);transition:transform .07s,box-shadow .07s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile.used{visibility:hidden}
.tile.sel,.pic.sel{border-color:var(--acc);background:var(--tint);box-shadow:0 4px 0 var(--acc)}
.tile.ok{border-color:var(--ok);background:#DCFCE7;box-shadow:0 4px 0 var(--ok-d);color:var(--ok-d)}
.tile.bad{border-color:var(--bad);background:#FFE4E6;box-shadow:0 4px 0 var(--bad-d);color:var(--bad-d);animation:shake .3s}
.tile.done{opacity:.35;pointer-events:none;background:#fff;color:#A3A7C2;border-color:var(--line);box-shadow:none}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.audio-row{display:flex;gap:14px;justify-content:center;margin:6px 0 26px}
.spk{width:110px;height:110px;border-radius:28px;border:0;background:var(--acc);box-shadow:0 6px 0 var(--acc-d);font-size:48px;color:#fff;transition:transform .07s,box-shadow .07s}
.spk.slow{width:76px;height:76px;font-size:32px;align-self:flex-end;border-radius:22px}
.spk:active{transform:translateY(5px);box-shadow:0 1px 0 var(--acc-d)}
.pic-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pic{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);padding:18px 8px;text-align:center;color:var(--ink);transition:transform .07s,box-shadow .07s}
.pic:active{transform:translateY(4px)}
.pic .emo{font-size:56px;line-height:1.2}
.pic .cw{font-size:17px;font-weight:800;margin-top:8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
.tile.m{padding:15px 8px;text-align:center}
.mic{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:2px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);background:#fff;color:var(--acc);font-size:18px;font-weight:900;padding:22px;margin-top:10px;transition:transform .07s,box-shadow .07s}
.mic:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.mic.rec{border-color:var(--acc);background:var(--tint);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(47,107,255,.18)}}
.heard{text-align:center;color:var(--muted);margin-top:14px;min-height:22px}
.foot,.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:16px 16px calc(18px + env(safe-area-inset-bottom));z-index:30}
.foot{background:rgba(255,255,255,.92);border-top:2px solid var(--line)}
.sheet{animation:up .2s ease-out;border-top:2px solid transparent}
.sheet.ok{background:#DCFCE7;border-color:#A7E8BC}.sheet.bad{background:#FFE4E6;border-color:#FBC3C8}
.s-head{font:800 21px Unbounded,sans-serif;margin-bottom:8px}
.sheet.ok .s-head,.sheet.ok .s-ans{color:var(--ok-d)}.sheet.bad .s-head,.sheet.bad .s-ans,.sheet.bad .s-lbl{color:var(--bad-d)}
.s-lbl{font-weight:900;font-size:17px}
.s-ans{font-size:17px;margin:2px 0 14px}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
/* end / streak */
.center{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 20px}
.big2{font:800 26px/1.15 Unbounded,sans-serif;color:var(--acc);margin:12px 0 20px}
.stats{display:flex;gap:10px;width:100%}
.stat{flex:1;border:2px solid var(--c);border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 4px 0 var(--c)}
.stat .h{background:var(--c);color:#fff;font-size:12px;font-weight:900;padding:6px}
.stat .v{font:800 18px Unbounded,sans-serif;color:var(--c);padding:12px 4px}
.flame{font-size:110px;animation:pop .6s}
.streaknum{font:800 72px/1 Unbounded,sans-serif;color:#F97316}
/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(30,27,75,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.ov.mid{align-items:center}
@keyframes fade{from{opacity:0}}
.mod{background:#fff;width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));text-align:center;animation:up2 .2s}
.ov.mid .mod{border-radius:28px;width:90%;max-width:400px;box-shadow:0 7px 0 var(--line)}
@keyframes up2{from{transform:translateY(60px);opacity:0}}
.mod.pop{background:var(--c);color:#fff;text-align:left}
.mod.pop .t{font:800 20px Unbounded,sans-serif}
.mod.pop .s{opacity:.9;margin:6px 0 16px}
.mod.pop .btn{background:#fff;color:var(--cd);box-shadow:0 6px 0 rgba(0,0,0,.22)}
.mtitle{font:800 19px/1.25 Unbounded,sans-serif;margin:10px 0 16px}
.chest{font-size:110px;display:inline-block}
.chest.shake{animation:cshake .5s 2}
@keyframes cshake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:16px;z-index:60;font-size:16px;font-weight:800;max-width:90%;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.25);animation:fade .2s}
/* call */
.call-av{display:flex;flex-direction:column;align-items:center;padding:4px 0 8px}
.ring{border-radius:50%;padding:10px}
.ring.talk{animation:talk 1s infinite}
@keyframes talk{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.35)}50%{box-shadow:0 0 0 18px rgba(249,115,22,.08)}}
.status{color:var(--muted);font-size:16px;margin-top:6px;min-height:22px;text-align:center}
.chat{padding-bottom:190px}
.msg{max-width:85%;padding:11px 14px;border-radius:20px;margin:8px 0;font-size:16px;line-height:1.35;-webkit-user-select:text;user-select:text}
.msg.ai{background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.msg.me{background:var(--tint);border:2px solid var(--acc);margin-left:auto}
.bigmic{width:84px;height:84px;border-radius:50%;border:0;background:var(--acc);box-shadow:0 6px 0 var(--acc-d);font-size:38px;color:#fff;display:block;margin:0 auto;transition:transform .07s,box-shadow .07s}
.bigmic:active{transform:translateY(5px);box-shadow:0 1px 0 var(--acc-d)}
.bigmic.rec{background:var(--bad);box-shadow:0 6px 0 var(--bad-d);animation:pulse 1s infinite}
.bigmic:disabled{filter:grayscale(.7);opacity:.5}
.trow{display:flex;gap:8px;margin-top:10px;align-items:center}
.trow .field{margin:0}
.fb{text-align:left;white-space:pre-wrap;font-size:16px;line-height:1.5;-webkit-user-select:text;user-select:text}
/* swipe + confetti */
#fm-swipe{position:fixed;left:-56px;top:45%;width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;z-index:60;display:flex;align-items:center;justify-content:center;font:900 26px Nunito,sans-serif;box-shadow:0 4px 0 var(--acc-d);pointer-events:none;opacity:0}
.fm-conf{position:fixed;top:-12px;width:10px;height:14px;border-radius:3px;z-index:70;pointer-events:none;animation:fmfall linear forwards}
@keyframes fmfall{to{transform:translateY(105vh) rotate(720deg)}}
.fm-today .tch-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip.tch{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.55);box-shadow:none}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ptile{border:0;border-radius:24px;padding:18px 12px;background:var(--sc);box-shadow:0 6px 0 var(--scd);color:#fff;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:132px;transition:transform .07s,box-shadow .07s}
.ptile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--scd)}
.ptile i{font-style:normal;font-size:36px;line-height:1.1}
.ptile b{font:800 16px Unbounded,sans-serif;margin-top:auto}
.ptile span{font-size:13px;opacity:.9}
.rbtn{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);padding:16px;margin-bottom:12px;color:var(--ink);transition:transform .07s,box-shadow .07s}
.rbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.rbtn .ri{font-size:36px}.rbtn b{display:block;font:800 15px Unbounded,sans-serif;margin-bottom:2px}.rbtn .small{display:block}
.rs{font-size:14px;white-space:nowrap}
.rnum{width:30px;height:30px;border-radius:10px;background:var(--c);color:#fff;font:800 15px Unbounded,sans-serif;display:flex;align-items:center;justify-content:center;float:left;margin:0 10px 4px 0}
.rt{font-size:17px;line-height:1.25;margin:2px 0 10px}
.rx{font-size:16px;line-height:1.45;margin-bottom:10px;clear:both}
.exr{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:2px dashed var(--line)}
.spk-s{flex:none;width:42px;height:42px;border-radius:14px;border:0;background:var(--acc);box-shadow:0 4px 0 var(--acc-d);font-size:18px;color:#fff;transition:transform .07s,box-shadow .07s}
.spk-s:active{transform:translateY(4px);box-shadow:0 0 0 var(--acc-d)}
.why{font-size:15px;line-height:1.4;color:var(--bad-d);margin:0 0 10px;font-weight:700}

k9:{rules:[{t:'by — на чём едем',x:'by car — на машине, by bus — на автобусе, by train — на поезде, by plane — на самолёте.',ex:[['We go by car.','Мы едем на машине.'],['We go to school by bus.','Мы ездим в школу на автобусе.']]},{t:'Что было: went, saw, ate',x:'Про прошлое глаголы меняются: go → went, see → saw, eat → ate, is → was.',ex:[['I went to Turkey.','Я ездила в Турцию.'],['It was fun!','Было весело!']]}],phrases:[['Where did you go?','Куда ты ездила?'],['I want to go again!','Я хочу ещё раз!']]},
k10:{rules:[{t:'Больше, меньше: -er than',x:'Сравниваем: bigger than — больше чем, smaller than — меньше чем, taller than — выше чем.',ex:[['An elephant is bigger than a cat.','Слон больше кошки.'],['I am taller than my friend.','Я выше своей подруги.']]},{t:'Самый: the -est',x:'Самый большой — the biggest, самый быстрый — the fastest.',ex:[['A whale is the biggest animal.','Кит — самое большое животное.'],['Which is bigger?','Кто больше?']]}],phrases:[['My favourite animal is a dolphin.','Моё любимое животное — дельфин.'],['We are at the zoo.','Мы в зоопарке.']]}

let COURSE=COURSE_ADULT,NODES=[],TRACK='adult';
function buildNodes(){NODES=[];COURSE.forEach((u,ui)=>{u.lessons.forEach((l,li)=>{NODES.push({type:'lesson',id:l.id,unit:ui,lesson:l,num:li+1,of:u.lessons.length});if(li===1)NODES.push({type:'chest',id:u.id+'-chest',unit:ui})});NODES.push({type:'call',id:u.id+'-call',unit:ui,topic:u.call})});}
function setTrack(t){TRACK=t==='kids'?'kids':'adult';COURSE=TRACK==='kids'?COURSE_KIDS:COURSE_ADULT;buildNodes()}

const GUIDES={
u1:{rules:[
{t:'Глагол to be — «быть»',x:'По-английски нельзя сказать «Я Адиль» без глагола: нужен am / is / are. I am, you are, he / she / it is, we / they are. В речи сокращают: I\'m, you\'re, he\'s.',ex:[['I am from Kazakhstan.','Я из Казахстана.'],['She is my wife.','Она моя жена.'],['We are busy today.','Мы сегодня заняты.']]},
{t:'Вопрос и отрицание с to be',x:'Вопрос — am / is / are выходят вперёд: Are you…? Is it…? Отрицание — добавляем not: I am not, it is not (isn\'t), you are not (aren\'t).',ex:[['Are you busy?','Ты занят?'],['Is it cold today?','Сегодня холодно?'],['I am not tired.','Я не устал.']]},
{t:'my, your, his, her, our',x:'«Чей?» — my (мой), your (твой, ваш), his (его), her (её), our (наш). Ставятся прямо перед существительным, без артикля.',ex:[['My name is {NAME}.','Меня зовут {NAME_RU}.'],['What is your name?','Как тебя зовут?'],['Our son likes football.','Наш сын любит футбол.']]}
],phrases:[['Nice to meet you.','Приятно познакомиться.'],['What do you do?','Чем вы занимаетесь?'],['How was your weekend?','Как прошли выходные?'],['That sounds great!','Звучит отлично!']]},
u2:{rules:[
{t:'Вежливая просьба: Can I have…?',x:'В кафе не говорят «Give me». Просят так: Can I have…? или ещё вежливее Could I have…? Слово please — в конце.',ex:[['Can I have a coffee, please?','Можно мне кофе, пожалуйста?'],['Could I have the bill, please?','Можно счёт, пожалуйста?']]},
{t:'Выбор блюда: I will have / I would like',x:'Когда заказываете: I\'ll have… (Я возьму…) или I\'d like… (Я бы хотел…). Обе формы звучат естественно и вежливо.',ex:[['I will have the fish.','Я возьму рыбу.'],['I would like a salad.','Я бы хотел салат.']]},
{t:'a / an — один предмет',x:'Перед одним предметом, который можно посчитать, ставят a (перед согласным звуком) или an (перед гласным звуком): a coffee, a cake, an apple, an orange juice.',ex:[['A small tea, please.','Маленький чай, пожалуйста.'],['An orange juice, please.','Апельсиновый сок, пожалуйста.']]}
],phrases:[['How much is it?','Сколько это стоит?'],['What do you recommend?','Что вы посоветуете?'],['Can I pay by card?','Можно оплатить картой?'],['Keep the change.','Сдачи не надо.']]},
u3:{rules:[
{t:'Where is…? Is it far?',x:'Где что-то находится: Where is + место? Далеко ли: Is it far from here? Короткие ответы: Yes, it is. / No, it isn\'t.',ex:[['Where is the station?','Где станция?'],['Is it far from here?','Это далеко отсюда?']]},
{t:'Указания: глагол в начале',x:'Дорогу объясняют глаголом без «вы»: Go straight. Turn left. Take the bus. Так же просят: Show me, please.',ex:[['Go straight and turn left.','Идите прямо и поверните налево.'],['Take the second street.','Сверните на вторую улицу.']]},
{t:'Предлоги места',x:'near — рядом, next to — вплотную рядом, opposite — напротив, on the left / on the right — слева / справа.',ex:[['It is near the hotel.','Это рядом с отелем.'],['The bank is on the left.','Банк слева.']]}
],phrases:[['I have a reservation.','У меня есть бронь.'],['Is breakfast included?','Завтрак включён?'],['What time is check-out?','Во сколько выезд?'],['Can you show me on the map?','Можете показать на карте?']]},
u4:{rules:[
{t:'Could you…? — вежливая просьба',x:'В деловом английском просят через Could you…? Это мягче, чем Can you…?, и намного вежливее приказа.',ex:[['Could you call me back?','Не могли бы вы перезвонить?'],['Could you send a sample?','Не могли бы вы отправить образец?']]},
{t:'will — обещание и решение',x:'Обещаете или решили прямо сейчас: I will (I\'ll) + глагол. Отрицание: I will not (won\'t).',ex:[['I will send you an email.','Я отправлю вам письмо.'],['We will pay next week.','Мы заплатим на следующей неделе.']]},
{t:'Let\'s… — давайте',x:'Предложить сделать вместе: Let\'s (= let us) + глагол. В речи почти всегда Let\'s.',ex:[['Let us meet at ten.','Давайте встретимся в десять.'],['Let us sign the contract.','Давайте подпишем договор.']]}
],phrases:[['Hello, this is {NAME} speaking.','Здравствуйте, это {NAME_RU}.'],['What is your best price?','Какая ваша лучшая цена?'],['Sorry, can you repeat that?','Извините, можете повторить?'],['When can you deliver?','Когда вы можете доставить?']]},
u5:{rules:[
{t:'this / that / these / those',x:'this — этот (рядом), that — тот (дальше). Для нескольких предметов: these — эти, those — те. Глагол тоже меняется: this is, these are.',ex:[['This shirt is nice.','Эта рубашка хорошая.'],['I like these shoes.','Мне нравится эта обувь.'],['How much are these jeans?','Сколько стоят эти джинсы?']]},
{t:'too — слишком',x:'too + прилагательное = «слишком»: too small, too big, too expensive. Нужно, чтобы вежливо отказаться от покупки.',ex:[['It is too small.','Это слишком мало.'],['It is too expensive.','Это слишком дорого.']]},
{t:'Сравнение: cheaper, bigger, more expensive',x:'Короткие прилагательные + er: cheap → cheaper, big → bigger, small → smaller. Длинные — через more: more expensive, more comfortable.',ex:[['Do you have something cheaper?','У вас есть что-то дешевле?'],['Do you have a bigger size?','У вас есть размер побольше?']]}
],phrases:[['Can I try it on?','Можно примерить?'],['I will take it.','Я возьму это.'],['I am just looking, thank you.','Я просто смотрю, спасибо.'],['Can I exchange it?','Можно обменять?']]},
u6:{rules:[
{t:'Present Simple — то, что бывает регулярно',x:'Привычки и расписание: I work, we go, they play. Глагол в начальной форме, без изменений.',ex:[['I drink coffee every morning.','Я пью кофе каждое утро.'],['We watch TV in the evening.','Вечером мы смотрим телевизор.']]},
{t:'he / she / it + s',x:'Главная ловушка: после he, she, it и одного человека (my son) к глаголу добавляется -s: works, plays, gets up, goes (после o — es).',ex:[['My son plays football.','Мой сын играет в футбол.'],['My daughter goes swimming.','Моя дочь ходит плавать.']]},
{t:'Вопрос и отрицание: do / does',x:'Вопрос: Do you…? Does he / she…? Отрицание: I do not (don\'t), she does not (doesn\'t). После does глагол уже без -s.',ex:[['Do you work on Saturday?','Ты работаешь в субботу?'],['She does not work on Sunday.','Она не работает в воскресенье.']]},
{t:'Как часто: always, usually, often, sometimes, never',x:'Слова частоты ставятся перед глаголом: I always relax, we sometimes play, I never work.',ex:[['I usually brush my teeth first.','Обычно я сначала чищу зубы.'],['I never work on Sunday.','Я никогда не работаю в воскресенье.']]}
],phrases:[['What time do you get up?','Во сколько ты встаёшь?'],['What do you do at the weekend?','Что ты делаешь на выходных?'],['I often work late.','Я часто работаю допоздна.']]},
u7:{rules:[
{t:'Что болит: I have a… / …hurts',x:'Болезнь или симптом: I have a headache / a fever / a cold / a cough. Боль в части тела: My back hurts. My tooth hurts.',ex:[['I have a headache.','У меня болит голова.'],['My back hurts.','У меня болит спина.']]},
{t:'should — совет',x:'Совет: You should + глагол. Отрицательный совет: You should not (shouldn\'t). Вопрос: Should I…?',ex:[['You should rest.','Вам стоит отдохнуть.'],['How often should I take it?','Как часто это принимать?']]},
{t:'Сколько раз: once, twice, three times',x:'once — один раз, twice — два раза, three times — три раза. Дальше: a day (в день), a week (в неделю).',ex:[['Twice a day after food.','Два раза в день после еды.'],['I go to the gym twice a week.','Я хожу в спортзал два раза в неделю.']]}
],phrases:[['I do not feel well.','Я плохо себя чувствую.'],['I need a doctor.','Мне нужен врач.'],['Do you do any sport?','Ты занимаешься спортом?']]},
u8:{rules:[
{t:'was / were — был, были',x:'Прошлое от to be: I / he / she / it was; you / we / they were. Вопрос: Where were you? Was it good?',ex:[['I was at home.','Я был(а) дома.'],['Where were you yesterday?','Где ты был(а) вчера?']]},
{t:'Правильные глаголы: + ed',x:'Большинство глаголов в прошлом получают -ed: work → worked, watch → watched, stay → stayed. Одна форма для всех лиц.',ex:[['I worked late.','Я работал(а) допоздна.'],['We stayed in a nice hotel.','Мы жили в хорошем отеле.']]},
{t:'Неправильные глаголы — учим наизусть',x:'Самые нужные: go → went, have → had, see → saw, buy → bought, take → took, meet → met, send → sent, tell → told, forget → forgot, swim → swam.',ex:[['We had a great time.','Мы отлично провели время.'],['I bought some gifts.','Я купил(а) подарки.']]},
{t:'Вопрос и отрицание: did',x:'Did + глагол в начальной форме: Did you sleep well? Отрицание: I did not (didn\'t) have time. После did — без -ed и без формы went.',ex:[['Did you finish the report?','Ты закончил(а) отчёт?'],['I did not have time.','У меня не было времени.']]}
],phrases:[['How was your trip?','Как прошла поездка?'],['What did you do today?','Что ты делал(а) сегодня?'],['It was a good day.','Это был хороший день.']]},
u9:{rules:[
{t:'going to — решённый план',x:'Решили заранее: I am going to + глагол. We are going to travel. Вопрос: Are you going to…?',ex:[['I am going to visit my parents.','Я собираюсь навестить родителей.'],['We are going to travel in summer.','Летом мы собираемся путешествовать.']]},
{t:'Present Continuous — договорённость',x:'Если уже договорились о времени и месте: We are meeting the partners on Monday. What are you doing tonight?',ex:[['What are you doing tonight?','Что ты делаешь сегодня вечером?'],['We are having guests tomorrow.','Завтра у нас гости.']]},
{t:'will — решение сейчас, обещание, прогноз',x:'Решили прямо в разговоре или обещаете: I will call you. Прогноз: It will take two weeks. I think they will love it.',ex:[['I will call you after the meeting.','Я позвоню тебе после встречи.'],['It will take two weeks.','Это займёт две недели.']]}
],phrases:[['Would you like to join us?','Хочешь присоединиться к нам?'],['Maybe next week.','Может, на следующей неделе.'],['How long are you going to stay?','Как долго вы собираетесь там пробыть?']]},
u10:{rules:[
{t:'Вежливость: could / would',x:'В деловом английском прямые просьбы смягчают: Could you please…? Could you give us…? Would it be possible to…?',ex:[['Could you please confirm the order?','Не могли бы вы подтвердить заказ?'],['Could you give us a better price?','Можете дать нам цену получше?']]},
{t:'Мягкий отказ: I am afraid…',x:'Вместо резкого «No» говорят: I am afraid we cannot… / Unfortunately, … / That is too high for us.',ex:[['I am afraid we cannot accept that.','Боюсь, мы не можем на это согласиться.'],['That is too high for us.','Для нас это слишком дорого.']]},
{t:'Письмо: начало и конец',x:'Начало: Thank you for your email. / I am writing to… Конец: I look forward to your reply. Please let me know. Подпись: Best regards.',ex:[['I am writing to ask about prices.','Пишу, чтобы узнать цены.'],['I look forward to your reply.','Жду вашего ответа.']]}
],phrases:[['What are your payment terms?','Каковы ваши условия оплаты?'],['There is a problem with our order.','С нашим заказом проблема.'],['We need a solution today.','Нам нужно решение сегодня.']]},
u11:{rules:[
{t:'Present Perfect: have / has + 3-я форма',x:'Говорим о жизненном опыте и о результате к настоящему моменту, без точного времени: I have been, she has visited. Сокращения: I\'ve, she\'s.',ex:[['I have been to Turkey twice.','Я был(а) в Турции дважды.'],['She has visited ten countries.','Она побывала в десяти странах.']]},
{t:'ever / never — «когда-нибудь / никогда»',x:'Вопрос об опыте: Have you ever…? Ответ: Yes, I have. / No, I have never… С never отрицание уже есть — not не нужно.',ex:[['Have you ever been to Europe?','Ты когда-нибудь был(а) в Европе?'],['I have never tried sushi.','Я никогда не пробовал(а) суши.']]},
{t:'just, already, yet',x:'just — только что; already — уже (в утверждении и вопросе); yet — ещё / уже, только в отрицании и вопросе, в конце фразы.',ex:[['I have just finished the report.','Я только что закончил(а) отчёт.'],['The goods have not arrived yet.','Товар ещё не пришёл.']]},
{t:'for и since — «сколько» и «с какого момента»',x:'for + период: for twenty years, for a week. since + точка начала: since May, since Monday. Вопрос: How long have you…?',ex:[['I have lived here for twenty years.','Я живу здесь двадцать лет.'],['She has worked here since May.','Она работает здесь с мая.']]},
{t:'Главная ловушка: yesterday, last week — уже Past Simple',x:'Если названо время в прошлом, Present Perfect нельзя: I sent it yesterday (не I have sent it yesterday).',ex:[['I sent the invoice yesterday.','Я отправил(а) инвойс вчера.'],['I have already sent the invoice.','Я уже отправил(а) инвойс.']]}

let AC=null;
function tone(fr,dur,type,gap,vol){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;fr.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const st=t0+i*gap;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(vol,st+.01);g.gain.exponentialRampToValueAtTime(.001,st+dur);o.connect(g);g.connect(AC.destination);o.start(st);o.stop(st+dur+.03)})}catch(e){}}
const SND={ok:()=>tone([660,990],.2,'sine',.1,.2),bad:()=>tone([200,160],.28,'square',.13,.07),tap:()=>tone([520],.06,'sine',0,.07),pair:()=>tone([700],.12,'sine',0,.15),win:()=>tone([523,659,784,1047],.3,'triangle',.13,.2),chest:()=>tone([392,523,659,784,1047,1319],.22,'triangle',.08,.18),combo:()=>tone([784,988,1175],.15,'triangle',.07,.15)};
let VOICE=null;
function pickVoice(){const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/en[-_]US/i.test(v.lang)&&/google/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
/* В APK (Capacitor WebView) браузерные голос и микрофон недоступны — используем плагины

const CAP=n=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n];
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const NTTS=()=>NATIVE&&CAP('TextToSpeech');
function hush(){try{const t=NTTS();if(t)t.stop().catch(()=>{});else speechSynthesis.cancel()}catch(e){}}
function say(t,rate,pitch){const nt=NTTS();if(nt)return nt.stop().catch(()=>{}).then(()=>nt.speak({text:String(t),lang:'en-US',rate:rate||S.rate,pitch:pitch||1,volume:1,category:'playback'})).catch(()=>{});return new Promise(res=>{if(!('speechSynthesis' in window))return res();try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=rate||S.rate;u.pitch=pitch||1;u.onend=res;u.onerror=res;speechSynthesis.speak(u)}catch(e){res()}})}
const WSR=window.SpeechRecognition||window.webkitSpeechRecognition;
const SR=(NATIVE&&CAP('SpeechRecognition'))?'plugin':WSR;
let REC=null;
function stopRec(){if(SR==='plugin'){try{CAP('SpeechRecognition').stop().catch(()=>{})}catch(e){}return}if(REC)try{REC.abort()}catch(e){}}
function listenOnce(){if(SR==='plugin'){const sp=CAP('SpeechRecognition');return (async()=>{
let p=await sp.checkPermissions().catch(()=>({speechRecognition:'prompt'}));
if(p.speechRecognition!=='granted'){p=await sp.requestPermissions().catch(()=>({}));if(p.speechRecognition!=='granted')throw 'not-allowed'}
let r;try{r=await sp.start({language:'en-US',maxResults:3,partialResults:false,popup:false})}catch(e){throw 'nospeech'}
const m=(r&&r.matches)||[];if(!m.length)throw 'nospeech';return m})()}
return new Promise((res,rej)=>{if(!SR)return rej('nosr');const r=new SR();REC=r;r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;let got=false;r.onresult=e=>{got=true;res([...e.results[0]].map(a=>a.transcript))};r.onerror=e=>{if(!got)rej(e.error||'err')};r.onend=()=>{REC=null;if(!got)rej('nospeech')};try{r.start()}catch(e){rej('busy')}})}

/* ===================== PROGRESS ===================== */
function ensureQuest(){const p=P(),t=today();if(p.quest.day!==t)p.quest={day:t,xp:0,lessons:0,calls:0,claimed:{}}}
function streakOf(p){if(!p.lastDay)return 0;const d=dayDiff(p.lastDay,today());if(d<=1)return p.streak;if(d===2&&p.freezes>0)return p.streak;return 0}
function touchDay(){const p=P(),t=today();if(p.lastDay===t)return false;const d=p.lastDay?dayDiff(p.lastDay,t):99;if(d===1)p.streak++;else if(d===2&&p.freezes>0){p.freezes--;p.streak++}else p.streak=1;p.best=Math.max(p.best,p.streak);p.lastDay=t;p.days=(p.days||[]).concat(t).slice(-400);return true}
function addXP(n){ensureQuest();const nd=touchDay();const p=P();p.xp+=n;p.quest.xp+=n;const wk=weekKey();if(!p.week||p.week.key!==wk)p.week={key:wk,xp:0};p.week.xp+=n;save();scheduleReminders();return nd}
function advU(n){const p=P();if(n&&NODES.filter(x=>x.unit===n.unit).every(x=>p.done[x.id]))SELU=null}
function curIdx(){const p=P();const i=NODES.findIndex(n=>!p.done[n.id]);return i<0?NODES.length:i}
function recordMistake(e){const en=e.answer||e.text,ru=e.ru||e.prompt;if(!en||!ru)return;const p=P();if(!p.mistakes.some(m=>m[0]===en)){p.mistakes.push([en,ru]);if(p.mistakes.length>30)p.mistakes.shift()}}

function level(){if(!S.current)return 0;return VIEW==='home'?1:2}
let depth=0,ignorePop=0,_inPop=false;

function syncHistory(){const Lv=level();try{while(depth<Lv){depth++;history.pushState({fmd:depth},'')}if(depth>Lv){ignorePop++;history.go(Lv-depth);depth=Lv}}catch(e){}}
window.addEventListener('popstate',e=>{
  if(ignorePop){ignorePop--;depth=(e.state&&e.state.fmd)||0;return}
  depth=(e.state&&e.state.fmd)||0;
  if(level()>depth){_inPop=true;fmBack();_inPop=false;if(level()>depth)syncHistory()}
});

(function(){

    sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();on=true},{passive:true});

/* ===================== MEMORY MODEL (spaced repetition, «мини-Birdbrain») ===================== */
const IVL=[0,1,2,4,8,16,32],DAY=86400000;
function hk(s){let h=5381;for(const c of String(s))h=((h<<5)+h+c.charCodeAt(0))|0;return 'k'+(h>>>0).toString(36)}
function memItem(e){if(e.type==='pic'){const o=e.options.find(o=>o[0]===e.answer)||[];return {en:e.answer,ru:e.prompt,em:o[2]||'⭐',w:1}}
if(e.type==='build'||e.type==='listen')return {en:e.answer,ru:e.ru||e.prompt};if(e.type==='speak')return {en:e.text,ru:e.ru};return null}
function memUpdate(e,ok){const m=memItem(e);if(!m||!m.en||!m.ru)return;const p=P();p.mem=p.mem||{};const k=hk(m.en),now=Date.now();
const x=p.mem[k]||{en:m.en,ru:m.ru,em:m.em||'',w:m.w?1:0,s:0,due:0,n:0,x:0};x.n++;L.failed=L.failed||{};
if(ok){if(L.failed[k])x.due=now+DAY;else{x.s=Math.min(x.s+1,IVL.length-1);x.due=now+IVL[x.s]*DAY}}
else{L.failed[k]=1;x.x++;x.s=Math.max(0,x.s-2);x.due=now+10*60000}
p.mem[k]=x}
function dueList(){const now=Date.now();return Object.values(P().mem||{}).filter(x=>x.due<=now).sort((a,b)=>a.s-b.s||a.due-b.due)}
function weakList(n){const d=dueList();if(d.length>=n)return d.slice(0,n);const rest=Object.values(P().mem||{}).filter(x=>!d.includes(x)).sort((a,b)=>a.s-b.s||b.x-a.x);return d.concat(rest).slice(0,n)}
function reviewItem(x,pool,kind){if(x.w){const W=uniqWords(learnedLessons()).filter(w=>w[0]!==x.en&&w[1]!==x.ru);return {type:'pic',prompt:x.ru,answer:x.en,options:shuffle([[x.en,x.ru,x.em||'⭐']].concat(shuffle(W).slice(0,3))),review:true}}
if(kind==='speak')return {type:'speak',text:x.en,ru:x.ru,review:true};return Object.assign(mkBuild(kind,x.en,x.ru,pool),{review:true})}
function lessonStrength(l){const m=P().mem||{};return l.phrases.reduce((a,x)=>a+((m[hk(tx(x[0]))]||{}).s||0),0)/l.phrases.length}
function weakestOf(pairs){return pairs.slice().sort((a,b)=>lessonStrength(a[0].lesson)-lessonStrength(b[0].lesson))[0][1]}
function startWeak(){const list=weakList(10);if(list.length<4)return toast('Пока мало данных — пройдите пару уроков, и здесь появятся ваши слабые места');
const pool=learnedLessons().flatMap(l=>l.phrases.flatMap(x=>words(tx(x[0]))));const kinds=['build','listen','build','speak','listen'];
const items=shuffle(list).map((x,i)=>reviewItem(x,pool,kinds[i%5]));L={node:null,mode:'weak',items,idx:0,correct:0,total:items.length,combo:0,maxCombo:0,wrong:0,start:Date.now(),title:'⚡ Слабые места',sub:'Персональное повторение'};lessonShell()}

function mkBuild(type,en,ru,pool){return {type,answer:en,prompt:ru,ru,tiles:shuffle(words(en).concat(distract(en,pool,3)))}}
function buildLesson(lesson){const ph=lesson.phrases.map(p=>[tx(p[0]),tx(p[1])]),W=lesson.words;const pool=ph.flatMap(p=>words(p[0]));
const wi=shuffle([...W.keys()]),pi=shuffle([...ph.keys()]);
const pic=j=>{const ans=W[wi[j]];const opts=shuffle([ans].concat(shuffle(W.filter(w=>w!==ans)).slice(0,3)));return {type:'pic',prompt:ans[1],answer:ans[0],options:opts}};
const B=j=>mkBuild('build',ph[pi[j]][0],ph[pi[j]][1],pool),Ls=j=>mkBuild('listen',ph[pi[j]][0],ph[pi[j]][1],pool),Sp=j=>({type:'speak',text:ph[pi[j]][0],ru:ph[pi[j]][1]});
const items=TRACK==='kids'?[pic(0),pic(1),B(0),{type:'match',pairs:shuffle(W).slice(0,5)},pic(2),Ls(1),pic(3),B(2),Sp(3),Ls(4)]:[pic(0),B(0),Ls(2),pic(1),B(1),{type:'match',pairs:shuffle(W).slice(0,5)},Sp(0),B(3),Ls(4),B(5),Sp(3),Ls(6)];
const own=new Set(ph.map(p=>p[0])),rp=learnedLessons().flatMap(l=>l.phrases.flatMap(x=>words(tx(x[0]))));
dueList().filter(x=>!x.w&&!own.has(x.en)).slice(0,2).forEach((x,i)=>items.splice(i?items.length-1:7,1,reviewItem(x,rp,i?'listen':'build')));return items}
function buildMistakes(){const p=P();const m=shuffle(p.mistakes).slice(0,8);const pool=COURSE.flatMap(u=>u.lessons.flatMap(l=>l.phrases.flatMap(x=>words(tx(x[0])))));
const items=m.map((x,i)=>Object.assign(mkBuild(i%2?'listen':'build',x[0],x[1],pool),{fromMistake:true}));if(m.length)items.push({type:'speak',text:m[0][0],ru:m[0][1],fromMistake:true});return items}

const t=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||'').join('').trim();if(!t){const er=new Error('empty');er.code=503;throw er}return t}

catch(e){if(C!==my)return;const m=String(e.message);st('Ошибка: '+(/quota|429|exhausted/i.test(m)?'исчерпан бесплатный лимит, попробуйте позже':m))}
if(C===my)lockCall(false)}
async function userTurn(){if(!C||C.busy)return;const my=C,b=document.getElementById('bm');hush();b.classList.add('rec');st('Слушаю…');
try{const alts=await listenOnce();if(C!==my)return;b.classList.remove('rec');pushUser(alts[0])}catch(e){if(C!==my)return;b.classList.remove('rec');st(e==='not-allowed'?'Нет доступа к микрофону':'Не расслышала — нажмите 🎤 ещё раз')}}
function typeTurn(){const i=document.getElementById('ti');const t=i.value.trim();if(!t||!C||C.busy)return;i.value='';hush();pushUser(t)}
function pushUser(t){bubble('me',t);C.history.push({role:'user',text:t});C.turns++;aiTurn()}
async function endCall(){stopRec();hush();if(!C)return goHome();
if(C.turns<2){toast('Скажите хотя бы 2 фразы, чтобы засчиталось');return goHome()}
const c=C;C=null;CALLDONE=false;const role=c.kind==='role';
show('callend',`<div class="center">${fox(110)}<div class="big2" style="color:#F97316">${role?'Сценка завершена!':'Звонок завершён!'}</div><div class="stars" id="stars"></div><div class="card fb" id="fb" style="width:100%">Лекси готовит разбор…</div></div><div class="foot"><button class="btn" id="fbb" disabled onclick="goHome()">Продолжить</button></div>`,{title:role?'Итог сценки':'Разбор звонка',sub:role?c.role.title:'Лекси'});
const learner=c.history.filter((m,i)=>m.role==='user'&&i>0).map(m=>'- '+m.text).join('\n');
const ask=role?`Сценка: «${c.role.title}». Цели ученика: ${c.role.goals.join('; ')}.\nФразы ученика:\n${learner}\n\nОтветь строго в таком виде:\nЗВЁЗДЫ: N\n(N от 1 до 3: 3 — все цели достигнуты почти без ошибок, 2 — большинство целей, 1 — мало.)\nЗатем по строке на каждую цель: «✅ цель» или «❌ цель».\nЗатем до 3 главных ошибок в формате «❌ как сказал → ✅ как правильно — кратко почему». Без вступлений, до 120 слов.`
:`Фразы ученика из разговора на английском:\n${learner}\n\nДай короткий разбор: 1 строка похвалы, затем до 3 главных ошибок строго в формате «❌ как сказал → ✅ как правильно — кратко почему». Если ошибок нет, скажи это и предложи одну фразу посложнее для следующего раза. Без вступлений, до 90 слов.`;
let fb='',okfb=true;try{fb=await gemini(P().track==='kids'?'You are a kind English teacher for a 9-year-old Russian-speaking girl. Answer in Russian, very simply and warmly, as for a child.':'You are a kind, precise English teacher for a Russian-speaking learner (A2–B1). Answer in Russian.',[{role:'user',text:ask}],2048)}catch(e){fb='Разбор не получился: '+e.message;okfb=false}
let stars=0;if(role&&okfb){const mm=fb.match(/ЗВ[ЁЕ]ЗДЫ\s*:\s*(\d)/i);stars=mm?Math.max(1,Math.min(3,+mm[1])):1;fb=fb.replace(/^.*ЗВ[ЁЕ]ЗДЫ.*(\n|$)/im,'').replace(/^\(N от.*(\n|$)/im,'').trim()}
const p=P();if(okfb){p.calls.push({d:today(),fb:fb.slice(0,400)});if(p.calls.length>5)p.calls.shift()}
const xp=role?10+5*stars:c.repeat?5:15;if(role)p.roles[c.role.id]=Math.max(p.roles[c.role.id]||0,stars);
const nd=addXP(xp);ensureQuest();p.quest.calls++;if(c.node&&!c.repeat){p.done[c.node.id]=true;advU(c.node)}save();CALLDONE=true;
if(VIEW!=='callend')return;SND.win();confetti();
if(role&&stars)document.getElementById('stars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
document.getElementById('fb').textContent=fb+`\n\n⚡ +${xp} XP`;const b=document.getElementById('fbb');b.disabled=false;if(nd)b.setAttribute('onclick','streakScreen()')}

/* ===================== STAGE 1: GUIDE / PRACTICE / TESTS / ROLEPLAY / WHY ===================== */
function exRow(x){const en=tx(x[0]),ru=tx(x[1]);return `<div class="exr"><button class="spk-s" data-t="${esc(en)}" onclick="say(this.dataset.t)">🔊</button><div><b>${esc(en)}</b><div class="small">${esc(ru)}</div></div></div>`}
function renderGuide(ui){const u=COURSE[ui],g=GUIDES[u.id]||GUIDES_KIDS[u.id];
show('guide',`<div class="fm-today" style="--sc:${u.color};--scd:${u.dark}"><div class="lbl">📖 Путеводитель · юнит ${ui+1}</div><div class="big" style="font-size:28px">${u.icon} ${esc(u.title)}</div><div class="comp" style="margin-bottom:0">Короткие правила и ключевые фразы. Нажмите 🔊, чтобы послушать.</div></div>`+
g.rules.map((r,k)=>`<div class="card"><div class="rnum" style="--c:${u.color}">${k+1}</div><h2 class="rt">${esc(r.t)}</h2><div class="rx">${esc(r.x)}</div>${r.ex.map(exRow).join('')}</div>`).join('')+
`<div class="fm-sec">Ключевые фразы</div><div class="card">${g.phrases.map(exRow).join('')}</div><button class="btn" onclick="goHome()">Понятно</button>`,{title:'Правила юнита',sub:u.title})}

function learnedLessons(){const p=P();const ls=COURSE.flatMap(u=>u.lessons).filter(l=>p.done[l.id]);return ls.length?ls:[COURSE[0].lessons[0]]}
function uniqWords(ls){const seenE=new Set(),seenR=new Set();return shuffle(ls.flatMap(l=>l.words)).filter(w=>{if(seenE.has(w[0])||seenR.has(w[1]))return false;seenE.add(w[0]);seenR.add(w[1]);return true})}
function renderPractice(){const n=P().mistakes.length;
const T=[['startWeak()','⚡','Слабое',dueList().length?dueList().length+' к повтору':'по вашим ошибкам','#F59E0B','#B45309'],["startPractice('speak')",'🗣️','Говорение','8 фраз вслух','#2F6BFF','#1847C2'],["startPractice('listen')",'🎧','Аудирование','8 фраз на слух','#8B5CF6','#6532D8'],["startPractice('words')",'🔤','Слова','Картинки и пары','#00A88F','#007F6C'],['startMistakes()','🩹','Ошибки',n?n+' фраз':'пока нет','#E5484D','#BE123C'],['startCall(-1)','🦊','Лекси','Разговор голосом','#F97316','#C2410C'],['renderRoles()','🎭','Сценки','Ролевые диалоги','#F5B400','#C08900'],["renderMedia('story')",'📖','Истории','Диалоги с вопросами','#14B8A6','#0D857A'],["renderMedia('radio')",'📻','Радио','Только на слух','#334155','#1E293B']];
show('practice',`<div class="small" style="margin:0 2px 12px">Тренировки по пройденным урокам — без нового материала. +5 XP за каждую.</div><div class="pgrid">${T.filter(t=>TRACK!=='kids'||!/renderRoles|radio/.test(t[0])).map(t=>`<button class="ptile" style="--sc:${t[4]};--scd:${t[5]}" onclick="${t[0]}"><i>${t[1]}</i><b>${t[2]}</b><span>${t[3]}</span></button>`).join('')}</div>`,{title:'Практика',sub:'Тренировки'})}
function startPractice(kind){const ls=learnedLessons();const ph=shuffle(ls.flatMap(l=>l.phrases.map(p=>[tx(p[0]),tx(p[1])])));const W=uniqWords(ls);const pool=ph.flatMap(p=>words(p[0]));let items=[];
if(kind==='speak')items=ph.slice(0,8).map(p=>({type:'speak',text:p[0],ru:p[1]}));
else if(kind==='listen')items=ph.slice(0,8).map(p=>mkBuild('listen',p[0],p[1],pool));
else{for(let k=0;k<6;k++){const ans=W[k%W.length];items.push({type:'pic',prompt:ans[1],answer:ans[0],options:shuffle([ans].concat(shuffle(W.filter(w=>w!==ans)).slice(0,3)))})}items.splice(3,0,{type:'match',pairs:W.slice(0,5)});items.push({type:'match',pairs:shuffle(W).slice(0,5)})}
L={node:null,mode:'practice',items,idx:0,correct:0,total:items.length,combo:0,maxCombo:0,wrong:0,start:Date.now(),title:{speak:'Говорение',listen:'Аудирование',words:'Слова'}[kind],sub:'Практика'};lessonShell()}

function buildTest(ui,n){const items=[];COURSE[ui].lessons.forEach(l=>{const ph=shuffle(l.phrases.map(p=>[tx(p[0]),tx(p[1])]));const pool=ph.flatMap(p=>words(p[0]));
items.push(mkBuild('build',ph[0][0],ph[0][1],pool),mkBuild('listen',ph[1][0],ph[1][1],pool),mkBuild('build',ph[2][0],ph[2][1],pool));
const W=l.words,ans=W[rnd(0,W.length-1)];items.push({type:'pic',prompt:ans[1],answer:ans[0],options:shuffle([ans].concat(shuffle(W.filter(w=>w!==ans)).slice(0,3)))})});return shuffle(items).slice(0,n)}
function startTest(kind,ui){const leg=kind==='legend';const items=buildTest(ui,leg?15:12);
L={node:null,mode:kind,unit:ui,items,idx:0,correct:0,total:items.length,combo:0,maxCombo:0,wrong:0,start:Date.now(),maxWrong:leg?1:3,title:(leg?'👑 ':'⏩ ')+COURSE[ui].title,sub:leg?'Легендарный: не больше 1 ошибки':'Тест: не больше 3 ошибок'};
modal(`<div class="chest">${leg?'👑':'⏩'}</div><div class="mtitle">${leg?'Легендарный уровень':'Перейти к юниту «'+esc(COURSE[ui].title)+'»?'}</div><div class="small" style="margin-bottom:16px">${leg?items.length+' заданий по всему юниту. Можно ошибиться только 1 раз. Награда — золотой юнит и +40 XP.':items.length+' заданий. Не больше 3 ошибок — и все предыдущие юниты будут засчитаны.'}</div><button class="btn" onclick="closeModal();lessonShell()">Начать тест</button><button class="link" onclick="closeModal();L=null">Не сейчас</button>`,true)}
function failTest(){const leg=L.mode==='legend',ui=L.unit;SND.bad();
show('end',`<div class="center">${fox(130)}<div class="big2" style="color:var(--bad)">Почти получилось!</div><div class="card" style="width:100%">Ошибок больше, чем ${L.maxWrong}. ${leg?'Повторите уроки юнита и попробуйте снова — золото того стоит.':'Пройдите юнит по порядку или попробуйте тест ещё раз.'}</div></div><div class="foot"><button class="btn" onclick="startTest('${L.mode}',${ui})">Ещё раз</button><button class="link" onclick="goHome()">На главную</button></div>`,{title:'Тест не пройден',sub:COURSE[ui].title});L.finished=true}

async function explain(){const r=L.lastR,e=L.items[L.idx];const w=document.getElementById('why'),b=document.querySelector('.why-b');if(!w||w.dataset.on)return;w.dataset.on=1;if(b)b.remove();
if(!S.key){w.textContent='Нужен ключ Gemini в ⚙️ Настройках.';return}w.textContent='Лекси объясняет…';
const task=e.type==='pic'?'выбрать английское слово для «'+e.prompt+'»':e.type==='speak'?'произнести фразу «'+e.text+'» ('+e.ru+')':e.type==='listen'?'записать услышанную фразу':'перевести на английский: «'+e.prompt+'»';
const q=`Задание: ${task}.\nОтвет ученика: «${r.user||'—'}».\nПравильный ответ: «${r.answer}».\nОбъясни по-русски, в чём ошибка ученика и какое правило здесь работает. 2–3 коротких предложения, до 50 слов, без вступлений и без повтора задания.`;
try{const t=await gemini('Ты добрый и точный учитель английского для взрослого русскоязычного ученика уровня A2.',[{role:'user',text:q}],1024);if(document.getElementById('why')===w)w.textContent='🦊 '+t}catch(err){w.textContent='Не получилось: '+err.message}}

function renderRoles(){const p=P();
show('roles',`<div class="small" style="margin:0 2px 12px">Ролевые диалоги с Лекси. У каждой сценки свои цели — в конце звёзды и разбор ошибок.</div>`+ROLES.map(r=>{const s=p.roles[r.id]||0;return `<button class="rbtn" onclick="startRole('${r.id}')"><span class="ri">${r.ico}</span><span class="grow"><b>${esc(r.title)}</b><span class="small">${esc(r.sub)}</span></span><span class="rs">${'⭐'.repeat(s)}${'<span style="opacity:.3">⭐</span>'.repeat(3-s)}</span></button>`}).join(''),{title:'Сценки',sub:'Ролевые диалоги'})}
function startRole(id){const r=ROLES.find(x=>x.id===id);
startConv({kind:'role',role:r,topic:r.scene+' The learner has these goals: '+r.goals.join('; ')+'. Play your role naturally, stay in the scene, and lead the learner step by step through the goals without listing them.',title:r.ico+' '+r.title,sub:'Сценка'})}

render();bgPull(true);
</script>
